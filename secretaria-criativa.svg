<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Secretária criativa da Andrea: ideias, organização e comunicação visual">
<style>
text{font-family:Arial,sans-serif}.float{animation:float 4s ease-in-out infinite}.late{animation-delay:-2s}.tick{stroke-dasharray:30;stroke-dashoffset:30;animation:check 6s infinite}.two{animation-delay:1s}.three{animation-delay:2s}.dot{animation:pulse 3s infinite}.d2{animation-delay:1s}.d3{animation-delay:2s}@keyframes float{50%{transform:translateY(-7px)}}@keyframes check{15%,80%{stroke-dashoffset:0}95%,100%{stroke-dashoffset:30}}@keyframes pulse{50%{opacity:.3}}
</style>
<rect width="960" height="300" rx="20" fill="#171c2c"/>
<circle cx="880" cy="40" r="130" fill="#262a43"/><circle cx="50" cy="290" r="100" fill="#25253b"/>
<text x="40" y="48" font-size="13" letter-spacing="3" fill="#d7b7ed">O MEU ESPAÇO CRIATIVO</text>
<text x="40" y="85" font-size="28" font-weight="bold" fill="#fff4ef">Ideias com cor. Trabalho com organização.</text>
<g class="float"><rect x="44" y="119" width="240" height="132" rx="12" fill="#f5ede8"/>
<rect x="60" y="135" width="208" height="13" rx="5" fill="#d8c6df"/>
<rect x="60" y="161" width="84" height="72" rx="7" fill="#b5b4dc"/>
<circle cx="102" cy="187" r="13" fill="#ffdfaa"/><path d="M66 225l24-24 17 15 14-11 18 20" fill="#777aab"/>
<rect x="156" y="166" width="103" height="7" rx="3" fill="#9c92ac"/><rect x="156" y="183" width="82" height="7" rx="3" fill="#c5b8cd"/>
<circle cx="166" cy="218" r="10" fill="#da9e9a"/><circle cx="198" cy="218" r="10" fill="#a2bcae"/><circle cx="230" cy="218" r="10" fill="#d5b4e2"/></g>
<g class="float late"><rect x="325" y="126" width="217" height="125" rx="12" fill="#eee9fa"/>
<text x="346" y="153" font-size="14" font-weight="bold" fill="#514566">DO PLANO À AÇÃO</text>
<g fill="none" stroke="#b9a9cd" stroke-width="2"><rect x="346" y="168" width="15" height="15" rx="3"/><rect x="346" y="193" width="15" height="15" rx="3"/><rect x="346" y="218" width="15" height="15" rx="3"/></g>
<g fill="none" stroke="#659b82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path class="tick" d="M349 175l4 4 9-11"/><path class="tick two" d="M349 200l4 4 9-11"/><path class="tick three" d="M349 225l4 4 9-11"/></g>
<g font-size="13" fill="#655c75"><text x="374" y="180">Organizar</text><text x="374" y="205">Criar</text><text x="374" y="230">Comunicar</text></g></g>
<g transform="translate(584 134)"><text y="20" font-size="19" font-weight="bold" fill="#f6e8f5">Um projeto de cada vez.</text><text y="49" font-size="14" fill="#c1bbd0">Da primeira ideia ao último detalhe.</text><g fill="#d7b7ed"><circle class="dot" cx="8" cy="81" r="6"/><circle class="dot d2" cx="31" cy="81" r="6"/><circle class="dot d3" cx="54" cy="81" r="6"/></g><text y="112" font-size="12" letter-spacing="1" fill="#aaa4bd">ANDREA MACIEIRA</text></g>
</svg>
